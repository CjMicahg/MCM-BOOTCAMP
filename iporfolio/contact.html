<div class="active" >
    <div class="contact-container">
      <h1>Contact Us</h1>
      <p>We'd love to hear from you! Please fill in the form below.</p>
      
      <form class="contact-form">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" placeholder="e.g., CJ Micah" required>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" placeholder="e.g., cjmicah@example.com" required>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" placeholder="e.g., 0711 123456">

        <label for="message">Your Message:</label>
        <textarea id="message" name="message" rows="5" placeholder="Type your message here..." required></textarea>

        <button type="submit" class="btn">Send Message</button>
      </form>
    </div>
